<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <meta name="theme-color" content="#0b0e11" />

    <title>Yaseen Gym — Offline</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #0b0e11;
        color: #f4f4f5;
        font-family: system-ui, sans-serif;
      }

      main {
        width: 100%;
        max-width: 390px;
        padding: 32px;
        border: 1px solid #283128;
        border-radius: 24px;
        background: #14191e;
        text-align: center;
      }

      .icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 24px;
        display: grid;
        place-items: center;
        border: 1px solid #394628;
        border-radius: 18px;
        background: #20291c;
        color: #bef264;
      }

      .brand {
        color: #bef264;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
      }

      h1 {
        margin: 12px 0;
        font-size: 27px;
      }

      p {
        color: #a1a1aa;
        font-size: 14px;
        line-height: 1.8;
      }

      button {
        width: 100%;
        margin-top: 16px;
        padding: 14px;
        border: 0;
        border-radius: 12px;
        background: #bef264;
        color: #101510;
        font: inherit;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }

      button:focus-visible {
        outline: 2px solid white;
        outline-offset: 4px;
      }
    </style>
  </head>

  <body>
    <main>
      <div class="icon" aria-hidden="true">
        <svg
          width="30"
          height="30"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        >
          <path d="m3 3 18 18"/>
          <path d="M8.5 16.5a5 5 0 0 1 7 0"/>
          <path d="M5 12a10 10 0 0 1 5-2"/>
          <path d="M14 10a10 10 0 0 1 5 2"/>
          <path d="M2 8a16 16 0 0 1 4-2"/>
          <path d="M10 4a16 16 0 0 1 12 4"/>
          <circle cx="12" cy="20" r="1"/>
        </svg>
      </div>

      <div class="brand">Yaseen Gym</div>

      <h1>Connection needed.</h1>

      <p>
        Connect to the internet to load your gym workspace.
        Payments and account changes require an online connection.
      </p>

      <button id="retry" type="button">Try again</button>
    </main>

    <script>
      document.getElementById('retry').addEventListener('click', function () {
        window.location.reload();
      });
    </script>
  </body>
</html>
